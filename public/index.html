<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Handoff</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F1B3D;--paper:#F5F7FB;--line:#DCE2F0;--blue:#3A56FF;--amber:#FFB020;--mint:#1FA37A;--rose:#E5484D;--mute:#5B6785}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 'Hanken Grotesk',system-ui,sans-serif;background:var(--paper);color:var(--ink);display:grid;grid-template-columns:230px 1fr;min-height:100vh}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0}h1{font-size:clamp(1.8rem,4vw,3rem);line-height:1.05;letter-spacing:-.02em;font-weight:700}h2{font-size:1.2rem;margin:22px 0 6px}h3{font-size:1.05rem}
aside{background:var(--ink);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;gap:8px;align-items:center;font:700 1.35rem 'Bricolage Grotesque',sans-serif;margin:0 6px 18px}
nav button,.pp{display:flex;width:100%;gap:8px;align-items:center;background:none;border:0;color:#C9D2EE;font:inherit;padding:8px 10px;border-radius:10px;cursor:pointer;text-align:left}
nav button:hover,.pp:hover{background:#1D2C5A}nav button.on{background:#fff;color:var(--ink);font-weight:600}.pp.on{background:#243468;color:#fff}
#fb:not(:empty){margin-left:auto;background:var(--amber);color:var(--ink);border-radius:99px;padding:0 8px;font-size:12px;font-weight:600}
.side-h{margin:22px 10px 4px;color:#8F9BC4;font-size:13px}main{padding:28px clamp(16px,4vw,48px) 60px;max-width:1100px;width:100%}
.hero p{color:var(--mute);margin:10px 0 0;font-size:1.05rem}.bar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:10px 0}.lead{color:var(--mute);max-width:70ch}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}a.card{display:block;color:inherit;text-decoration:none}a.card:hover{border-color:var(--blue)}
.it{border-left:5px solid var(--blue)}.it.in_progress{border-left-color:var(--amber)}.it.done{border-left-color:var(--mint)}.it.dropped,.it.carried{border-left-color:#98A2B3;opacity:.7}.it.late{border-left-color:var(--rose)}
.t{font-weight:600}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}.out{margin:6px 0;color:var(--mute);font-style:italic}small{color:var(--mute)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
button{font:inherit;cursor:pointer}.pri{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:7px 14px;font-weight:600}.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--ink)}
.sm{padding:3px 10px;font-size:13px}button:disabled{opacity:.5;cursor:default}
.chip{border-radius:99px;padding:2px 10px;background:#E8ECFA;font-size:13px;display:inline-flex;gap:6px;align-items:center;border:0;color:var(--ink)}.chip.handover{background:#FFE9B8}.chip.doc{background:#DDF4EA}.chip.btn{cursor:pointer;padding:3px 12px 3px 4px}.chip.btn.on{background:var(--ink);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}
.av{width:24px;height:24px;border-radius:50%;color:#fff;font-size:12px;font-weight:600;display:inline-grid;place-items:center;flex:none}
.carry i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:3px}.carry.hot i{background:var(--amber)}
.due{font-size:13px;color:var(--mute)}.due.late{color:var(--rose);font-weight:600}
.trail{list-style:none;margin:14px 0 0;padding:0 0 0 24px;border-left:3px dotted var(--line)}.trail li{position:relative;margin:12px 0}
.trail li:before{content:'';position:absolute;left:-34px;top:20px;width:13px;height:13px;border-radius:50%;background:var(--blue);border:3px solid var(--paper)}.trail li.handover:before{background:var(--amber)}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:18px}.two.wide{grid-template-columns:1.1fr 1fr}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px}.col{background:#E9EDF8;border-radius:18px;padding:6px 10px 10px;min-height:260px}.col.over{outline:2px dashed var(--blue)}.col h2{margin:10px 4px 4px}
.form{display:grid;gap:8px}.row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.row>*{flex:1;min-width:120px}
input,textarea,select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);width:100%}textarea{display:block;margin:6px 0;resize:vertical}
.chips input{width:150px}pre{white-space:pre-wrap;font:inherit;margin:6px 0}.letter{background:#FFF8E6;border-color:#F3DFA8}.letter pre{font-size:1.02rem;line-height:1.6}
.empty{color:var(--mute);padding:14px;border:1px dashed var(--line);border-radius:14px;margin:8px 0}
dialog{border:0;border-radius:18px;padding:20px;width:min(440px,92vw);color:var(--ink)}dialog::backdrop{background:#0F1B3D99}dialog .actions{display:flex;flex-direction:row-reverse;justify-content:flex-start;gap:8px;margin-top:12px}dialog ul{padding-left:18px}
.skel i{display:block;height:12px;border-radius:6px;margin:12px 0;background:linear-gradient(90deg,#E4E9F5,#F8F9FD,#E4E9F5);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
#toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;display:none;max-width:90vw;z-index:9}#toast.err{background:var(--rose)}
.seg{display:inline-flex;background:#E8ECFA;border-radius:99px;padding:3px;margin-bottom:12px}.seg button{border:0;background:none;padding:6px 16px;border-radius:99px;color:var(--ink)}.seg button.on{background:var(--ink);color:#fff}
.drop{display:block;position:relative;border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--mute)}.drop:hover,.drop:focus-within{border-color:var(--blue)}.drop input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}a.chip{color:var(--ink);text-decoration:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:820px){body{grid-template-columns:1fr}aside{position:static;height:auto}.two,.two.wide,.board{grid-template-columns:1fr}}
</style></head><body>
<aside><div class="brand"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="11" cy="15" r="8" fill="none" stroke="#fff" stroke-width="3"/><circle cx="19" cy="15" r="8" fill="none" stroke="#FFB020" stroke-width="3"/></svg>Handoff</div>
<nav><button data-v="home" onclick="go(home)">Home</button><button data-v="meetings" onclick="go(meetings)">Meetings</button><button data-v="board" onclick="go(board)">Board</button><button data-v="followups" onclick="go(followups)">Follow-ups<span id="fb"></span></button><button data-v="docs" onclick="go(docs)">Knowledge</button></nav>
<div class="side-h">Working as</div><div id="ppl"></div></aside>
<main id="main"></main><dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],enc=encodeURIComponent;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fmt=d=>d?new Date(d).toLocaleDateString():'-';
async function api(p,o={}){const r=await fetch('/api'+p,{headers:{'Content-Type':'application/json'},...o,body:o.body&&JSON.stringify(o.body)});const d=await r.json();if(!r.ok)throw new Error(d.error);return d}
function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(t.k);t.k=setTimeout(()=>t.style.display='none',3500)}
const PAL=['#3A56FF','#E5484D','#1FA37A','#B45FD6','#D97A00'];
const av=n=>`<span class="av" style="background:${PAL[[...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0)%5]}" title="${esc(n)}">${esc(String(n).trim()[0]||'?').toUpperCase()}</span>`;
const isOpen=i=>['open','in_progress'].includes(i.status),days=d=>Math.round((new Date(d).setHours(0,0,0,0)-new Date().setHours(0,0,0,0))/864e5);
const isLate=i=>isOpen(i)&&i.dueDate&&days(i.dueDate)<0;
const due=i=>!i.dueDate?'<span class="due">no date</span>':isLate(i)?`<span class="due late">${-days(i.dueDate)}d late</span>`:isOpen(i)?`<span class="due">${days(i.dueDate)===0?'due today':'due in '+days(i.dueDate)+'d'}</span>`:`<span class="due">${fmt(i.dueDate)}</span>`;
const carry=n=>n?`<span class="carry ${n>=2?'hot':''}" title="Passed forward ${n} times">${'<i></i>'.repeat(n)}</span>`:'';
const empty=t=>`<div class="empty">${t}</div>`,M=new Map(),reg=a=>(a.forEach(i=>M.set(i._id,i)),a);
const dlg=$('#dlg');
function ask(title,ph){return new Promise(res=>{dlg.innerHTML=`<form method="dialog"><h3>${esc(title)}</h3><input id="dv" placeholder="${esc(ph||'')}" autofocus><div class="actions"><button value="ok" class="pri">Save</button><button value="x" class="ghost">Cancel</button></div></form>`;dlg.onclose=()=>res(dlg.returnValue==='ok'?$('#dv').value.trim():null);dlg.showModal()})}
function hist(id){const i=M.get(id);dlg.innerHTML=`<h3>${esc(i.title)}</h3><ul>${(i.history||[]).map(x=>`<li><b>${fmt(x.at)}</b> ${esc(x.event.replace(/_/g,' '))}${x.detail?': '+esc(x.detail):''}</li>`).join('')||'<li>No history yet</li>'}</ul><div class="actions"><button class="ghost" onclick="dlg.close()">Close</button></div>`;dlg.showModal()}
async function patch(id,b){try{await api('/actions/'+id,{method:'PATCH',body:b});toast('Updated');refresh()}catch(e){toast(e.message,1)}}
async function closeIt(id,s){const o=await ask(s==='done'?'What was the outcome?':'Why is this being dropped?','One line is enough');if(o)patch(id,{status:s,outcome:o})}
async function reassign(id){const o=await ask('Reassign to','Name');if(o)patch(id,{owner:o})}
const card=i=>`<article class="card it ${i.status} ${isLate(i)?'late':''}" draggable="true" data-id="${i._id}"><div class="t">${esc(i.title)}</div><div class="meta">${i.owner?av(i.owner)+'<span>'+esc(i.owner)+'</span>':'<span class="due">unassigned</span>'}${due(i)}${carry(i.carryCount)}</div>${(i.linkedDocs||[]).map(l=>`<span class="chip doc" title="${esc(l.reason)}">${esc(l.title)}</span>`).join(' ')}${i.meetingTitle?`<div><small>${esc(i.meetingTitle)}</small></div>`:''}${i.outcome?`<p class="out">${esc(i.outcome)}</p>`:''}<div class="acts">${isOpen(i)?`${i.status==='open'?`<button class="ghost sm" onclick="patch('${i._id}',{status:'in_progress'})">Start</button>`:''}<button class="ghost sm" onclick="closeIt('${i._id}','done')">Close</button><button class="ghost sm" onclick="closeIt('${i._id}','dropped')">Drop</button><button class="ghost sm" onclick="reassign('${i._id}')">Reassign</button>`:''}<button class="ghost sm" onclick="hist('${i._id}')">History</button></div></article>`;
const chaseCard=i=>`<article class="card it late"><div class="t">${esc(i.title)}</div><div class="meta">${i.owner?av(i.owner)+'<span>'+esc(i.owner)+'</span>':''}<span class="due late">${esc(i.reason)}</span>${carry(i.carryCount)}</div><button class="pri sm" onclick="nudge('${i._id}',this)">Draft nudge</button><pre hidden></pre></article>`;
async function nudge(id,b){b.disabled=true;b.textContent='Drafting...';try{const r=await api(`/actions/${id}/nudge`,{method:'POST'}),p=b.nextElementSibling;p.hidden=false;p.textContent=(r.degraded?'(Template. AI unavailable.)\n':'')+r.text;b.textContent='Redraft'}catch(e){toast(e.message,1);b.textContent='Draft nudge'}b.disabled=false}
const mcard=(m,ms=[])=>{const p=ms.find(x=>x._id===m.previousMeetingId);return `<a href="#" class="card" data-m="${m._id}"><h3>${esc(m.title)}</h3><div class="meta"><span class="chip ${m.type}">${m.type==='handover'?'Handover':'Meeting'}</span><span class="chip">${m.status}</span>${(m.participants||[]).map(n=>av(n)).join('')}</div>${p?`<small>Continues from ${esc(p.title)}</small>`:''}</a>`};
document.addEventListener('click',e=>{const a=e.target.closest('[data-m]');if(a){e.preventDefault();go(()=>detail(a.dataset.m))}});
let me='',cur;
const badge=()=>api('/followups').then(r=>$('#fb').textContent=r.length||'').catch(()=>{});
const go=f=>{cur=f;$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===f.name));f().then(badge).catch(e=>toast(e.message,1))},refresh=()=>go(cur);
async function home(){const[mine,chase,ms]=await Promise.all([api('/actions?owner='+enc(me)),api('/followups'),api('/meetings')]);const w=reg(mine).filter(isOpen);
$('#main').innerHTML=`<header class="hero"><h1>${w.length?`${w.length} ${w.length===1?'item is':'items are'} waiting on ${esc(me)}`:`Nothing is waiting on ${esc(me)}`}</h1><p>${chase.length?`${chase.length} across the team ${chase.length===1?'needs':'need'} chasing.`:'Nothing across the team needs chasing.'}</p></header>
<div class="two"><section><h2>Waiting on you</h2>${w.map(card).join('')||empty('Nothing assigned. Pick up work from the board.')}</section><section><h2>Needs chasing</h2>${chase.map(chaseCard).join('')||empty('No overdue or stuck items.')}</section></div><h2>Recent handoffs</h2><div class="strip">${ms.slice(0,4).map(m=>mcard(m,ms)).join('')}</div>`}
const readFile=f=>new Promise((res,rej)=>{const r=new FileReader(),txt=/\.(txt|md)$/i.test(f.name);r.onerror=()=>rej(new Error('Could not read the file'));r.onload=()=>res(txt?{filename:f.name,text:r.result}:{filename:f.name,mimeType:f.type,data:String(r.result).split(',')[1]});txt?r.readAsText(f):r.readAsDataURL(f)});
const prevOpts=ms=>`<option value="">Start fresh</option>${ms.map(m=>`<option value="${m._id}">Carry open items from: ${esc(m.title)}</option>`).join('')}`;
async function meetings(){const ms=await api('/meetings');let file=null;$('#main').innerHTML=`<div class="bar"><h1>Meetings and handovers</h1></div>
<div class="card"><div class="seg"><button id="t1" class="on">Import a document</button><button id="t2">Create manually</button></div>
<div id="imp"><label class="drop"><input type="file" id="fi" accept=".pdf,.docx,.txt,.md"><span id="fn">Choose a PDF, DOCX, TXT or MD file</span></label><p class="lead">Or paste the text instead:</p><textarea id="pt" rows="4" placeholder="Paste notes, minutes or a chat export"></textarea><button class="pri" id="gi">Generate meeting</button><div id="rv"></div></div>
<form id="nf" class="form" hidden><div class="row"><input name="title" placeholder="Title" required><select name="type"><option value="meeting">Meeting</option><option value="handover">Work handover</option></select></div><input name="p" placeholder="Participants, separated by commas"><select name="prev">${prevOpts(ms)}</select><input name="agenda" placeholder="Agenda"><button class="pri">Create</button></form></div>
<ol class="trail">${ms.map(m=>`<li class="${m.type}">${mcard(m,ms)}</li>`).join('')||empty('No meetings yet. Import a document to create the first one.')}</ol>`;
const tab=n=>{$('#imp').hidden=n!==1;$('#nf').hidden=n!==2;$('#t1').classList.toggle('on',n===1);$('#t2').classList.toggle('on',n===2)};$('#t1').onclick=()=>tab(1);$('#t2').onclick=()=>tab(2);
$('#fi').onchange=e=>{file=e.target.files[0]||null;$('#fn').textContent=file?file.name:'Choose a PDF, DOCX, TXT or MD file'};
$('#gi').onclick=async e=>{const b=e.target,text=$('#pt').value.trim();if(!file&&text.length<20)return toast('Choose a file or paste some text first',1);if(file&&file.size>5e6)return toast('That file is over 5 MB',1);
b.disabled=true;$('#rv').innerHTML='<div class="skel"><i></i><i></i><i style="width:60%"></i></div>';
try{const r=await api('/meetings/import/preview',{method:'POST',body:file?await readFile(file):{filename:'pasted text',text}});if(r.degraded)toast('AI unavailable. Showing a rule-based draft to review.',1);review(r,ms)}catch(x){$('#rv').innerHTML='';toast(x.message,1)}b.disabled=false};
$('#nf').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const m=await api('/meetings',{method:'POST',body:{title:f.get('title'),type:f.get('type'),participants:f.get('p').split(',').map(s=>s.trim()).filter(Boolean),agenda:f.get('agenda'),previousMeetingId:f.get('prev')||undefined}});toast('Created');go(()=>detail(m._id))}catch(x){toast(x.message,1)}}}
function review(r,ms){$('#rv').innerHTML=`<div class="form" style="margin-top:14px"><h3>Review and create</h3><div class="row"><input id="rt" value="${esc(r.title)}" aria-label="Title"><select id="ry"><option value="meeting"${r.type==='meeting'?' selected':''}>Meeting</option><option value="handover"${r.type==='handover'?' selected':''}>Work handover</option></select></div><input id="rpp" value="${esc((r.participants||[]).join(', '))}" placeholder="Participants" aria-label="Participants"><input id="ra" value="${esc(r.agenda||'')}" placeholder="Agenda" aria-label="Agenda"><textarea id="rs" rows="3" aria-label="Summary">${esc(r.summary)}</textarea><textarea id="rd" rows="3" placeholder="Decisions, one per line" aria-label="Decisions">${esc((r.decisions||[]).join('\n'))}</textarea>${(r.actionItems||[]).map(a=>`<div class="row ai"><input value="${esc(a.title)}" aria-label="Item"><input value="${esc(a.owner||'')}" placeholder="Owner" aria-label="Owner"><input type="date" value="${esc((a.dueDate||'').slice(0,10))}" aria-label="Due date"></div>`).join('')}<select id="rp" aria-label="Previous meeting">${prevOpts(ms)}</select><button class="pri" id="rc">Create meeting</button></div>`;
$('#rc').onclick=async e=>{const b=e.target;b.disabled=true;try{const m=await api('/meetings',{method:'POST',body:{title:$('#rt').value,type:$('#ry').value,participants:$('#rpp').value.split(',').map(s=>s.trim()).filter(Boolean),agenda:$('#ra').value||undefined,rawNotes:r.rawNotes,previousMeetingId:$('#rp').value||undefined}});
const its=$$('.ai').map(d=>{const[i,o,t]=$$('input',d);return{title:i.value,owner:o.value||null,dueDate:t.value||null}}).filter(x=>x.title);
await api(`/meetings/${m._id}/recap/apply`,{method:'POST',body:{summary:$('#rs').value,decisions:$('#rd').value.split('\n').filter(Boolean),actionItems:its}});toast('Meeting created');go(()=>detail(m._id))}catch(x){toast(x.message,1);b.disabled=false}}}
async function detail(id){const{meeting:m,items}=await api('/meetings/'+id);reg(items);
$('#main').innerHTML=`<button class="ghost sm" onclick="go(meetings)">Back to meetings</button><div class="bar"><div><h1>${esc(m.title)}</h1><div class="meta"><span class="chip ${m.type}">${m.type==='handover'?'Handover':'Meeting'}</span><span class="chip">${m.status}</span>${m.participants.map(n=>av(n)).join('')}</div></div></div>${m.agenda?`<p class="lead">${esc(m.agenda)}</p>`:''}
<div class="two wide"><section><h2>Notes</h2><textarea id="notes" rows="9" placeholder="Paste notes, chat or a transcript">${esc(m.rawNotes)}</textarea><button class="pri" id="gen">Turn notes into a recap</button><div id="recap"></div>
${m.summary?`<h2>Recap</h2><div class="card"><p>${esc(m.summary)}</p>${m.decisions.length?`<h3>Decided</h3><ul>${m.decisions.map(d=>`<li>${esc(d)}</li>`).join('')}</ul>`:''}${m.linkedDocs.map(l=>`<span class="chip doc" title="${esc(l.reason)}">${esc(l.title)}</span>`).join(' ')}</div>`:''}</section>
<section><h2>Action items</h2>${items.map(card).join('')||empty('No items yet. Generate a recap to create them.')}<h2>Catch someone up</h2><div class="chips">${m.participants.map(p=>`<button class="chip btn" data-brief="${esc(p)}">${av(p)}${esc(p)}</button>`).join('')}<input id="who" placeholder="Someone else" aria-label="Person"><button class="ghost sm" id="bb">Brief</button></div><div id="brief"></div></section></div>`;
$$('[data-brief]').forEach(b=>b.onclick=()=>brief(id,b.dataset.brief));$('#bb').onclick=()=>brief(id,$('#who').value);
$('#gen').onclick=async e=>{const b=e.target;b.disabled=true;$('#recap').innerHTML='<div class="skel"><i></i><i></i><i style="width:60%"></i></div>';
try{const r=await api(`/meetings/${id}/recap`,{method:'POST',body:{notes:$('#notes').value}});if(r.degraded)toast('AI unavailable. Showing a rule-based draft to review.',1);
$('#recap').innerHTML=`<div class="card"><h3>Review before saving</h3><textarea id="rs" rows="3">${esc(r.summary)}</textarea><textarea id="rd" rows="3" placeholder="Decisions, one per line">${esc(r.decisions.join('\n'))}</textarea>${r.actionItems.map(a=>`<div class="row ai"><input value="${esc(a.title)}" aria-label="Item"><input value="${esc(a.owner||'')}" placeholder="Owner" aria-label="Owner"><input type="date" value="${esc((a.dueDate||'').slice(0,10))}" aria-label="Due date"></div>`).join('')}<button class="pri" id="sv">Save recap and create items</button></div>`;
$('#sv').onclick=async()=>{try{const its=$$('.ai').map(d=>{const[i,o,t]=$$('input',d);return{title:i.value,owner:o.value||null,dueDate:t.value||null}}).filter(x=>x.title);await api(`/meetings/${id}/recap/apply`,{method:'POST',body:{summary:$('#rs').value,decisions:$('#rd').value.split('\n').filter(Boolean),actionItems:its}});toast('Recap saved');go(()=>detail(id))}catch(x){toast(x.message,1)}}}catch(x){$('#recap').innerHTML='';toast(x.message,1)}b.disabled=false}}
async function brief(id,p){if(!p.trim())return toast('Enter a name first',1);const box=$('#brief');box.innerHTML='<div class="skel"><i></i><i></i><i></i></div>';try{const r=await api(`/meetings/${id}/brief?person=`+enc(p));box.innerHTML=`<div class="card letter"><h3>For ${esc(p)}</h3>${r.degraded?'<small>AI unavailable. Built from saved data.</small>':''}<pre>${esc(r.text)}</pre></div>`}catch(e){box.innerHTML='';toast(e.message,1)}}
let mineOnly=false;
async function board(){const all=reg(await api('/actions')).filter(i=>i.status!=='carried'),list=mineOnly?all.filter(i=>(i.owner||'').toLowerCase()===me.toLowerCase()):all,
cols=[['open','Open',i=>i.status==='open'],['in_progress','In progress',i=>i.status==='in_progress'],['closed','Closed',i=>!isOpen(i)]];
$('#main').innerHTML=`<div class="bar"><h1>Board</h1></div><p class="lead">Drag a card to change its status. Closing asks for an outcome.</p><div class="chips"><button class="chip btn ${mineOnly?'':'on'}" id="f0">Everyone</button><button class="chip btn ${mineOnly?'on':''}" id="f1">${av(me)}${esc(me)}</button></div><div class="board">${cols.map(([k,n,f])=>`<div class="col" data-col="${k}"><h2>${n}</h2>${list.filter(f).map(card).join('')||empty('Empty')}</div>`).join('')}</div>`;
$('#f0').onclick=()=>{mineOnly=false;refresh()};$('#f1').onclick=()=>{mineOnly=true;refresh()};
$$('.it[draggable]').forEach(c=>c.ondragstart=e=>e.dataTransfer.setData('text/plain',c.dataset.id));
$$('.col').forEach(c=>{c.ondragover=e=>{e.preventDefault();c.classList.add('over')};c.ondragleave=()=>c.classList.remove('over');c.ondrop=e=>{e.preventDefault();c.classList.remove('over');const id=e.dataTransfer.getData('text/plain'),i=M.get(id),k=c.dataset.col;if(!i)return;if(k==='closed'){if(isOpen(i))closeIt(id,'done')}else if(i.status!==k)patch(id,{status:k})}})}
async function followups(){const its=await api('/followups');$('#main').innerHTML=`<div class="bar"><h1>Follow-ups</h1></div><p class="lead">Items that are overdue or have been passed forward twice or more. Draft a nudge for the owner.</p>${its.map(chaseCard).join('')||empty('All clear. Nothing needs chasing.')}`}
async function docs(){const ds=await api('/docs');$('#main').innerHTML=`<div class="bar"><h1>Knowledge</h1><button class="pri" id="nb">Add document</button></div>
<div class="card"><h3>Ask the knowledge base</h3><p class="lead">Answers come only from your documents and past meetings, with the sources used.</p><div class="row"><input id="q" placeholder="For example: Who owns the vendor SLA and what is blocking it?" aria-label="Question"><button class="pri" id="ab" style="flex:none">Ask</button></div><div id="ans"></div></div>
<form id="df" class="card form" hidden><div class="row"><input name="title" placeholder="Title" required><input name="tags" placeholder="Tags, separated by commas"></div><textarea name="content" rows="3" placeholder="What does this document say?" required></textarea><button class="pri">Save document</button></form><h2>Documents</h2><div class="strip">${ds.map(d=>`<div class="card"><h3>${esc(d.title)}</h3><div class="chips">${d.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div><p>${esc(d.content)}</p></div>`).join('')||empty('No documents yet.')}</div>`;
$('#nb').onclick=()=>{$('#df').hidden=!$('#df').hidden};
const ask=async()=>{const q=$('#q').value.trim();if(q.length<3)return toast('Type a question first',1);const b=$('#ab');b.disabled=true;$('#ans').innerHTML='<div class="skel"><i></i><i></i><i style="width:60%"></i></div>';
try{const r=await api('/ask',{method:'POST',body:{question:q}});$('#ans').innerHTML=`<div class="card letter">${r.degraded?'<small>AI unavailable. Showing the closest matches.</small>':''}<pre>${esc(r.answer)}</pre><div class="chips">${r.sources.map(s=>s.kind==='meeting'?`<a href="#" class="chip" data-m="${s.refId}">Meeting: ${esc(s.title)}</a>`:`<span class="chip doc">Document: ${esc(s.title)}</span>`).join('')||'<small>No sources used.</small>'}</div></div>`}catch(e){$('#ans').innerHTML='';toast(e.message,1)}b.disabled=false};
$('#ab').onclick=ask;$('#q').onkeydown=e=>{if(e.key==='Enter')ask()};
$('#df').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await api('/docs',{method:'POST',body:{title:f.get('title'),content:f.get('content'),tags:f.get('tags').split(',').map(s=>s.trim()).filter(Boolean)}});toast('Document saved');refresh()}catch(x){toast(x.message,1)}}}
function people(ppl){$('#ppl').innerHTML=ppl.map(p=>`<button class="pp ${p===me?'on':''}" data-p="${esc(p)}">${av(p)}${esc(p)}</button>`).join('');$$('#ppl button').forEach(b=>b.onclick=()=>{me=b.dataset.p;$$('#ppl button').forEach(x=>x.classList.toggle('on',x===b));refresh()})}
(async()=>{try{const ms=await api('/meetings'),ppl=[...new Set(ms.flatMap(m=>m.participants))];me=ppl.includes('Rohan')?'Rohan':ppl[0]||'You';people(ppl);go(home)}catch(e){toast(e.message,1)}})();
</script></body></html>
